server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（关键）：nginx 默认仅 1MB，手机直出的照片普遍 3~8MB，
    # 会在到达后端之前就被网关以 413 拒绝（前端表现为“请求失败（HTTP 413）”）。
    # 这里放宽到 64MB 只作粗粒度护栏；精确的业务上限由后端负责
    # （MAX_UPLOAD_SIZE_MB，默认 50MB），超限时返回友好文案。
    # ⚠ 两者必须同向调整：nginx 的值得大于后端业务上限，否则用户拿到的是裸 413。
    client_max_body_size 64m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 注意：nginx 的 add_header 不会跨层级继承——某个 location 一旦出现
    # add_header，server 级的那几条就对该 location 失效，因此各段需重复声明。

    # ---------- 后端接口 / 静态产出：必须优先于下方正则，用 ^~ 阻断正则匹配 ----------
    # SSE 进度流：关闭缓冲（最长前缀匹配优先命中本段）
    location ^~ /api/v1/ads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location ^~ /files/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ---------- 前端静态资源缓存策略 ----------
    # HTML 入口：不缓存，保证能拿到新的资源版本戳（tools/stamp.mjs 写入 ?v=<hash>）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # JS / CSS：每次带 ETag/Last-Modified 协商缓存。
    # 查询串已带内容哈希，命中 304 成本极低，且绝不会拿到过期代码。
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    # 图片 / 字体：内容不变，长缓存
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
