# ============================================================
# 服务器端部署 compose —— 全部通过 GHCR 镜像运行
#
# 由 GitHub Actions (deploy.yml) 在 push main 后自动执行：
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# 需要一个 .env（含各 LLM_KEY / DASHSCOPE_KEY 等，不入库）：
#   - 首次部署：把 .env base64 后配置到 GitHub Secret `DEPLOY_ENV_BASE64`，
#     Actions 会自动写到本目录 `.docker.env`。
#   - 之后可在这台服务器上手动修改 /opt/ad-agent/.docker.env 并重启 backend。
# ============================================================

services:
  backend:
    image: ghcr.io/heyinlin495/ad-agent/backend:latest
    container_name: ad-agent-backend
    restart: unless-stopped
    env_file:
      - path: .docker.env
        required: false
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      # 对象存储走真实阿里云 OSS（凭据来自 .docker.env/.env 的 OSS_*，不入库）
      - STORAGE_TYPE=oss
      - DATABASE_URL=postgresql+psycopg2://adagent:adagent@postgres:5432/ad_agent
      - STORAGE_DIR=/data/storage
      - ASSETS_DIR=/app/assets
      - UPLOAD_DIR=/data/uploads
      # 生产安全自检（STRICT_SECURITY=true 下不满足会拒绝启动）所需覆盖项：
      # dev 的 DEBUG=true / CORS=* / 空 FILE_* 会导致 backend 启动即拒，这里显式给出厂销的合规值
      - DEBUG=false
      - CORS_ORIGINS=["https://agent.heyinlin.asia","http://agent.heyinlin.asia"]
      - FILE_ACCESS_TOKEN=NKzAyyWoeLANz_7DC-6rhiCXhzG-Btpc2VASvOd7pMk
      - FILE_URL_SECRET=DddPfI1F6tdxl_waNA5UE7tx_-b9S-Jxe3ksNF2nRpE
      - STRICT_SECURITY=true
      # 单张上传体积上限（MB）。这里显式声明，避免依赖 secret 里是否带该键；
      # compose 的 environment 优先级高于 env_file，故必然生效。
      # ⚠ 要同步 ≥ web/nginx.conf 的 client_max_body_size 方向调整（nginx 值须更大）。
      - MAX_UPLOAD_SIZE_MB=50
    ports:
      # 宿主机直接访问后端的端口：避开被占用的 8000，改到 8010；
      # 域名(agent.heyinlin.asia)侧走 host nginx -> web(8502) -> backend:8000(容器内)，不受影响
      - "8010:8000"
    volumes:
      - ad_data:/data
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    image: ghcr.io/heyinlin495/ad-agent/web:latest
    container_name: ad-agent-web
    restart: unless-stopped
    ports:
      # 对外暴露前端；若服务器已有 nginx 反代，可把此段去掉只保留 127.0.0.1:8502
      - "8502:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ad-agent-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: ad-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adagent
      POSTGRES_PASSWORD: adagent
      POSTGRES_DB: ad_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ------------------------------------------------------------
  # Caddy 子域接入（one-shot，幂等，失败自动回滚）
  #
  # 背景：服务器 80/443 由宿主 Caddy 提供；根域 heyinlin.asia 走 8501，
  #   www 走 8888，均已有证书。但 agent.heyinlin.asia 未在 Caddyfile 中
  #   声明站点 → 不为该 SNI 申请证书 → https 握手 TLSV1_ALERT_INTERNAL_ERROR。
  #
  # 本容器只做四件事（全部在宿主 /etc/caddy 上，挂载进来看得见）：
  #   1. 若 Caddyfile 已含该域名 → 直接退出（幂等）
  #   2. 备份 Caddyfile 为 .bak-<时间戳>
  #   3. 末尾追加 agent 站点块（不动既有内容）
  #   4. caddy validate 通过才 reload；失败则用备份回滚
  #
  # 安全：绝不改写既有站点块；validate 是硬门槛；失败自动还原。
  # 注：network_mode: host 使容器可直连宿主 Caddy admin API (127.0.0.1:2019)。
  # ------------------------------------------------------------
  caddy-subdomain:
    image: caddy:2-alpine
    container_name: ad-agent-caddy-subdomain
    restart: "no"
    network_mode: host
    volumes:
      - /etc/caddy:/etc/caddy
      - caddy_fix_done:/state
    environment:
      - DOMAIN=agent.heyinlin.asia
      - UPSTREAM=127.0.0.1:8502
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        D="$${DOMAIN}"; U="$${UPSTREAM}"; F=/etc/caddy/Caddyfile
        echo "== [caddy-subdomain] domain=$$D upstream=$$U =="
        if [ ! -f "$$F" ]; then echo "!! $$F 不存在，跳过（请人工确认 Caddy 配置位置）"; exit 0; fi
        if grep -qE "(^|[[:space:]])$$D([[:space:]]|\{|,)" "$$F"; then
          echo "== Caddyfile 已包含 $$D，无需改动（幂等退出）=="; exit 0
        fi
        TS=$$(date +%Y%m%d-%H%M%S)
        cp -a "$$F" "$$F.bak-$$TS" && echo "== 已备份: $$F.bak-$$TS =="
        {
          printf '\n# ---- ad-agent: %s (auto) ----\n' "$$TS"
          printf '%s {\n\tencode gzip\n\treverse_proxy %s\n}\n' "$$D" "$$U"
        } >> "$$F"
        echo "== 已追加 $$D 站点块 =="
        if caddy validate --config "$$F" >/dev/null 2>&1; then
          echo "== validate 通过 =="
          if caddy reload --config "$$F" --address 127.0.0.1:2019 2>&1; then
            echo "== caddy 已 reload（Caddy 将自动向 Let's Encrypt 申请证书）=="
          else
            echo "!! reload 失败，尝试 systemctl（容器内通常无权限，属正常）"
          fi
        else
          echo "!! validate 失败，回滚 $$F"
          cp -a "$$F.bak-$$TS" "$$F" && echo "== 已回滚，未影响线上配置 =="
          exit 1
        fi
        echo "== 完成。证书签发需数十秒；验证: curl -sI https://$$D/ =="

volumes:
  ad_data:
  redis_data:
  postgres_data:
  caddy_fix_done: