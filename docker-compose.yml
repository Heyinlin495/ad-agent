services:
  backend:
    build:
      context: ./backend
    container_name: ad-agent-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/ad_agent.db}
      - STORAGE_DIR=${STORAGE_DIR:-./data/storage}
      - ASSETS_DIR=/app/assets
      - CHROMA_DIR=${CHROMA_DIR:-./data/chroma}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./assets:/app/assets
    # 开发模式：热重载 + 源码挂载。生产请叠加 docker-compose.prod.yml
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  # 千问风格聊天式 Web 前端（静态站点 + nginx 反代），端口 8502
  web:
    build:
      context: ./web
    container_name: ad-agent-web
    ports:
      - "8502:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ad-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 生产环境可选：PostgreSQL 替代 SQLite
  postgres:
    image: postgres:16-alpine
    container_name: ad-agent-postgres
    environment:
      POSTGRES_USER: adagent
      POSTGRES_PASSWORD: adagent
      POSTGRES_DB: ad_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - prod

  # 生产环境可选：MinIO 替代本地文件存储
  minio:
    image: minio/minio:latest
    container_name: ad-agent-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    profiles:
      - prod

volumes:
  redis_data:
  postgres_data:
  minio_data:
