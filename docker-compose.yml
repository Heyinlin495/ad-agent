# ============================================================
# 跨境电商 AI 广告生成 Agent —— 本地开发调试 compose
#
#   docker compose up --build          # 仅后端 + 前端，最小依赖起步
#   docker compose --profile deps up -d --build
#                                      # 额外拉起 redis/postgres/minio（可选）
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       --profile prod up -d --build   # 生产（见 prod 覆盖层）
#
# 说明：
#   - 后端默认用 BUILD_DEPS=core（小镜像、构建快）；需要完整 AI 能力：
#       BUILD_DEPS=full docker compose build backend
#   - 后端以源码挂载 + --reload 热更新，改代码即生效（开发态）。
#   - 前端为静态站点，改 js/css 后浏览器强刷即可。
#   - 默认不启动 redis（后端在无 redis 时也能跑，仅在使用缓存/队列特性时才需要）：
#       需要时用 --profile deps 一键拉起 redis/postgres/minio。
# ============================================================

services:
  backend:
    build:
      context: ./backend
      args:
        BUILD_DEPS: ${BUILD_DEPS:-core}
    image: ad-agent-backend:${BUILD_DEPS:-core}
    container_name: ad-agent-backend
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # 本地用 SQLite（兼容默认），数据写进 ./data 便于持久化与排查
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/ad_agent.db}
      - STORAGE_DIR=${STORAGE_DIR:-./data/storage}
      - ASSETS_DIR=/app/assets
      - CHROMA_DIR=${CHROMA_DIR:-./data/chroma}
      - UPLOAD_DIR=${UPLOAD_DIR:-./data/uploads}
    ports:
      - "8000:8000"
    volumes:
      # 开发：源码热挂载（改代码无需重建镜像）
      - ./backend:/app
      # 运行时数据与字体资产持久化
      - ./data:/app/data
      - ./assets:/app/assets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./web
    image: ad-agent-web:latest
    container_name: ad-agent-web
    ports:
      - "8502:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- 可选：基础设施（默认不启动，用 --profile deps 拉起）----------
  redis:
    image: redis:7-alpine
    container_name: ad-agent-redis
    profiles:
      - deps
      - prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ad-agent-postgres
    profiles:
      - deps
      - prod
    environment:
      POSTGRES_USER: adagent
      POSTGRES_PASSWORD: adagent
      POSTGRES_DB: ad_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ad-agent-minio
    profiles:
      - deps
      - prod
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data: