name: Test

# PR 自动跑测试。push 到 main 也会跑，作为发布前保护。
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: 后端 pytest
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # 测试套件会直接构造 S3/OSS/MinIO 存储与 rembg 抠图等，必须装完整 requirements
      # （core 缺 minio/oss2/rembg 等会让 test_storage/test_kb 等失败）。
      # conftest 已把 ENVIRONMENT/各 PROVIDER 置为 mock；但 RATE_LIMIT 默认 60/min，
      # 大套件一分钟内 API 调用会超限(429)，CI 上调避免偶发失败。
      RATE_LIMIT_PER_MINUTE: "100000"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 安装完整依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        run: pytest -q
      - name: 上传 pytest 报告（失败时保留证据）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/.pytest_cache
          retention-days: 7

  web-static-check:
    name: 前端静态校验
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验 import/导出 一致性
        run: node tools/check.mjs