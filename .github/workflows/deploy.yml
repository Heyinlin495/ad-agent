name: Deploy

# 推到 main 时：构建并推送镜像到 GHCR，然后通过 SSH 在服务器上
# git pull 最新代码并 docker compose 拉镜像 + 重起服务。
on:
  push:
    branches:
      - main
  workflow_dispatch: {}      # 也支持手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: 构建镜像并推送 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送镜像 + 设置包可见性
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 docker-container driver 的 buildx：GHCR 缓存导出需要它（默认 docker driver 不支持）
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 后端（prod 需完整依赖 full）----
      - name: 构建并推送 backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}/backend
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: build/push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          build-args: BUILD_DEPS=full
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 前端 ----
      - name: 构建并推送 web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}/web
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: build/push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 让镜像对服务器免登录可 pull（public）----
      - name: 设置 GHCR 包为公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for img in backend web; do
            gh api --method POST \
              "repos/${{ github.repository }}/packages/container/$img" \
              -f visibility=public --silent 2>/dev/null || true
          done

  deploy:
    name: SSH 部署到服务器
    runs-on: ubuntu-latest
    needs: build-image
    environment: production
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_ENV_BASE64: ${{ secrets.DEPLOY_ENV_BASE64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 60m
          script: |
            set -e
            # sudo 兼容：若已是 root 或系统无 sudo 则直接用，否则用 sudo
            S() { if [ "$(id -u)" = 0 ] || ! command -v sudo >/dev/null 2>&1; then "$@"; else sudo "$@"; fi; }
            APP_DIR=/opt/ad-agent
            S mkdir -p "$APP_DIR"
            # 拉最新仓库代码（含部署 compose），首次为 clone
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR" && S git fetch origin main && S git reset --hard FETCH_HEAD
            else
              S git clone --depth 1 -b main https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            # 首次部署把 secrets 写成服务器端 .env；之后可手动维护（此文件不提交）
            if [ -n "$DEPLOY_ENV_BASE64" ]; then
              echo "$DEPLOY_ENV_BASE64" | base64 -d | S tee "$APP_DIR/.docker.env" >/dev/null
            fi
            cd "$APP_DIR"
            # 清理可能占用 8000/8502 端口的残留容器，防止 "port is already allocated"
            # （先 down 移除本项目 compose 管理的容器；再按名强删，兼容历史不同 project 的遗留）
            S docker compose -f docker-compose.deploy.yml down >/dev/null 2>&1 || true
            for c in ad-agent-backend ad-agent-web ad-agent-redis ad-agent-postgres; do
              S docker rm -f "$c" >/dev/null 2>&1 || true
            done
            # 释放磁盘：历史 unsed 镜像/构建缓存/停止容器都清掉（旧版 full 后端镜像累计几个 GB），
            # 防止下次拉取 backend 时 "no space left on device"
            S docker system prune -af >/dev/null 2>&1 || true
            S docker builder prune -af >/dev/null 2>&1 || true
            S docker container prune -f >/dev/null 2>&1 || true
            echo '== 磁盘占用（部署前）=='
            S df -h / /data 2>/dev/null | tail -n +1 || true
            S docker compose -f docker-compose.deploy.yml pull
            S docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            S docker image prune -f >/dev/null 2>&1 || true
            echo '====== 部署完成: docker compose ps ======'
            S docker compose -f docker-compose.deploy.yml ps

            # ---- 宿主机 nginx：agent.heyinlin.asia 反代（TLS 终结层）----
            # 用独立子域，避开被旧 Streamlit 项目占用的 heyinlin.asia / www，
            # 不触碰旧 nginx 的任何监听块。
            DOMAIN="agent.heyinlin.asia"
            NGINX_CONF_SRC="$APP_DIR/deploy/nginx/${DOMAIN}.conf"
            NGINX_MAIN=""
            echo "====== 配置宿主机 nginx: ${DOMAIN} ======"
            # 1) 优先探测常见布局；探测失败时尝试找到实际 nginx（编译版 /usr/local 等）
            if [ -d /etc/nginx/conf.d ]; then
              S cp "$NGINX_CONF_SRC" "/etc/nginx/conf.d/${DOMAIN}.conf"
              NGINX_MAIN=/etc/nginx/nginx.conf
            elif [ -d /etc/nginx/sites-available ]; then
              S cp "$NGINX_CONF_SRC" "/etc/nginx/sites-available/${DOMAIN}.conf"
              S ln -sf "/etc/nginx/sites-available/${DOMAIN}.conf" "/etc/nginx/sites-enabled/${DOMAIN}.conf"
              NGINX_MAIN=/etc/nginx/nginx.conf
            else
              # 非标准安装：用 nginx 二进制本身的 -t 才算数，别只看目录
              echo '!! 未在 /etc/nginx 找到布局；尝试定位实际 nginx 二进制与 conf...'
              # 找 nginx bin（PATH 或常见编译路径）
              NGX_BIN=""
              for bin in "$(command -v nginx 2>/dev/null)" /usr/local/nginx/sbin/nginx /usr/sbin/nginx; do
                if [ -n "$bin" ] && [ -x "$bin" ]; then NGX_BIN="$bin"; break; fi
              done
              if [ -n "$NGX_BIN" ]; then
                # 尝试并入 conf.d（多数自定义安装也有 conf.d）
                NGX_ROOT="$(S "$NGX_BIN" -V 2>&1 | tr ' ' '\n' | sed -n 's/.*--conf-path=\([^ ]*\).*/\1/p' | head -1)"
                NGX_PREFIX="${NGX_ROOT%/conf/nginx.conf}"
                if command -v "$NGX_ROOT" >/dev/null 2>&1 || [ -f "$NGX_ROOT" ]; then
                  NGX_CONF_DIR="$(dirname "$NGX_ROOT")/conf.d"
                else
                  # 兜底常见编译路径
                  NGX_CONF_DIR="${NGX_BIN%/sbin/nginx}/conf/conf.d"
                fi
                if [ -d "$NGX_CONF_DIR" ]; then
                  S cp "$NGX_CONF_SRC" "$NGX_CONF_DIR/${DOMAIN}.conf"
                  NGINX_MAIN="$NGX_ROOT"
                  echo "== 已装入实际 nginx conf.d: $NGX_CONF_DIR =="
                else
                  echo "!! nginx 二进制存在但未找到 conf.d（$NGX_BIN），以下为人工接入指引："
                fi
              else
                echo "!! 未找到 nginx 二进制，跳过宿主机 nginx 配置"
              fi
            fi
            # ACME 校验目录（certbot webroot）
            S mkdir -p /var/www/certbot/.well-known/acme-challenge
            # 证书存在才做 nginx -t + reload；证书未签发时提醒跑 certbot，不阻塞应用部署
            if [ -n "$NGINX_MAIN" ] && [ -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
              # NGX_BIN 可能未在标准分支赋值，这里兜底再探测一次
              if [ -z "$NGX_BIN" ]; then
                for bin in "$(command -v nginx 2>/dev/null)" /usr/local/nginx/sbin/nginx /usr/sbin/nginx; do
                  if [ -n "$bin" ] && [ -x "$bin" ]; then NGX_BIN="$bin"; break; fi
                done
              fi
              if [ -n "$NGX_BIN" ] && S "$NGX_BIN" -t >/dev/null 2>&1; then
                S systemctl reload nginx 2>/dev/null || S "$NGX_BIN" -s reload 2>/dev/null || echo '!! reload 需在服务器手动执行'
                echo "== 宿主机 nginx 已校验并重载（${DOMAIN}）=="
              else
                echo "!! nginx -t 失败或无 nginx 二进制，请人工检查 ${DOMAIN}.conf"
              fi
            elif [ -n "$NGINX_MAIN" ]; then
              echo "!! 尚未签发 ${DOMAIN} 证书，未重载 nginx。"
              echo '   首次需在服务器执行（域名已解析到本机 + 80 可达时，且 80 被旧项目占用时先在其配置放行 ACME）：'
              echo "   certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN} --agree-tos -m <你的邮箱>"
              echo "   签发成功后: sudo nginx -t && sudo systemctl reload nginx"
            fi