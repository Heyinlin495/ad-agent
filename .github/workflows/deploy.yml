name: Deploy

# 推到 main 时：构建并推送镜像到 GHCR，然后通过 SSH 在服务器上
# git pull 最新代码并 docker compose 拉镜像 + 重起服务。
on:
  push:
    branches:
      - main
  workflow_dispatch: {}      # 也支持手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: 构建镜像并推送 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送镜像 + 设置包可见性
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 用 docker-container driver 的 buildx：GHCR 缓存导出需要它（默认 docker driver 不支持）
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 后端（prod 需完整依赖 full）----
      - name: 构建并推送 backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}/backend
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: build/push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          build-args: BUILD_DEPS=full
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 前端 ----
      - name: 构建并推送 web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}/web
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - name: build/push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 让镜像对服务器免登录可 pull（public）----
      - name: 设置 GHCR 包为公开
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for img in backend web; do
            gh api --method POST \
              "repos/${{ github.repository }}/packages/container/$img" \
              -f visibility=public --silent 2>/dev/null || true
          done

  deploy:
    name: SSH 部署到服务器
    runs-on: ubuntu-latest
    needs: build-image
    environment: production
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_ENV_BASE64: ${{ secrets.DEPLOY_ENV_BASE64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # 关键：必须用 envs 显式声明要注入远程 shell 的变量名。
          # 仅顶层 env: 只作用于 runner 本地，不会传到远程 SSH 会话——曾因此
          # 远程 $DEPLOY_ENV_BASE64 为空，.docker.env 从未写入，导致生产缺 OSS 配置。
          envs: DEPLOY_ENV_BASE64
          command_timeout: 60m
          script: |
            set -e
            # sudo 兼容：若已是 root 或系统无 sudo 则直接用，否则用 sudo
            S() { if [ "$(id -u)" = 0 ] || ! command -v sudo >/dev/null 2>&1; then "$@"; else sudo "$@"; fi; }
            APP_DIR=/opt/ad-agent
            S mkdir -p "$APP_DIR"
            # 拉最新仓库代码（含部署 compose），首次为 clone
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR" && S git fetch origin main && S git reset --hard FETCH_HEAD
            else
              S git clone --depth 1 -b main https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            # 首次部署把 secrets 写成服务器端 .env；之后可手动维护（此文件不提交）
            if [ -n "$DEPLOY_ENV_BASE64" ]; then
              echo "$DEPLOY_ENV_BASE64" | base64 -d | S tee "$APP_DIR/.docker.env" >/dev/null
            fi
            # —— .docker.env 对象存储配置体检（值仅打长度/缺失，不泄露密钥）——
            # 目的：定位生产 backend 报 "OSS 配置不完整→降级本地" 是否因服务器 .docker.env 缺 OSS 键。
            echo '==== [体检] 服务器 .docker.env 对象存储配置 ===='
            if [ -f "$APP_DIR/.docker.env" ]; then
              echo "  文件存在，$(wc -l < "$APP_DIR/.docker.env" | tr -d ' ') 行"
              for k in STORAGE_TYPE OSS_ENDPOINT OSS_BUCKET OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET LLM_API_KEY DASHSCOPE_API_KEY; do
                v=$(grep -E "^$k=" "$APP_DIR/.docker.env" | head -1 | cut -d= -f2- | tr -d '\r')
                n=${#v}
                if [ "$n" -gt 0 ]; then echo "  $k = 已设置($n 字符)"; else echo "  $k = ***缺失/为空***"; fi
              done
            else
              echo '  !! .docker.env 文件不存在（部署未写成功或 secret 为空）'
            fi
            cd "$APP_DIR"
            # 清理可能占用 8000/8502 端口的残留容器，防止 "port is already allocated"
            # （先 down 移除本项目 compose 管理的容器；再按名强删，兼容历史不同 project 的遗留）
            S docker compose -f docker-compose.deploy.yml down >/dev/null 2>&1 || true
            for c in ad-agent-backend ad-agent-web ad-agent-redis ad-agent-postgres; do
              S docker rm -f "$c" >/dev/null 2>&1 || true
            done
            # 释放磁盘：历史 unsed 镜像/构建缓存/停止容器都清掉（旧版 full 后端镜像累计几个 GB），
            # 防止下次拉取 backend 时 "no space left on device"
            S docker system prune -af >/dev/null 2>&1 || true
            S docker builder prune -af >/dev/null 2>&1 || true
            S docker container prune -f >/dev/null 2>&1 || true
            echo '== 磁盘占用（部署前）=='
            S df -h / /data 2>/dev/null | tail -n +1 || true
            # 修正数据卷属主：非 root 的 app 用户(uid=1000)需要可写 /data。
            # named volume 首次挂载若镜像内 /data 不存在则默认 root 属主，导致 backend
            # storage 初始化 PermissionError；对已存在的卷用已在本机的 redis:7-alpine 做 chown。
            echo '== 修正数据卷属主（chown 1000:1000）=='
            VOL=$(S docker volume ls -q --filter name=ad_data 2>/dev/null | head -1)
            if [ -n "$VOL" ]; then
              S docker run --rm -v "$VOL:/data" redis:7-alpine sh -c 'chown -R 1000:1000 /data' 2>&1 | tail -2 || echo '!! chown 卷失败，backend 可能仍无法写 /data'
            else
              echo '!! 未找到 ad_data 卷（首次部署会由 compose 创建）'
            fi
            S docker compose -f docker-compose.deploy.yml pull
            S docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            S docker image prune -f >/dev/null 2>&1 || true
            echo '====== 部署完成: docker compose ps ======'
            S docker compose -f docker-compose.deploy.yml ps

            # ---- 后端探活 + 启动诊断（整段包成 () || true：绝不因诊断使 workflow 失败；日志务必打印）----
            (
              echo '====== 后端诊断（backend health + logs, 非致命）======'
              S docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} exited={{.State.ExitCode}}' ad-agent-backend 2>/dev/null || echo '!! 容器 ad-agent-backend 不存在'
              echo '--- 探活 backend:8000 (用容器内 python urllib，slim 无 curl/wget) ---'
              ok=""
              for i in 1 2 3 4 5 6 7 8; do
                if S docker exec ad-agent-backend python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=3)" >/dev/null 2>&1; then
                  echo "backend HEALTHY (attempt $i)"; ok=1; break
                else
                  echo "attempt $i: not ready"; sleep 10
                fi
              done
              [ -n "$ok" ] && echo '== backend 容器内健康 ==' || echo '!! backend 未在 ~80s 内就绪'
              echo '--- 宿主探活 127.0.0.1:8010 ---'
              curl -sS -o /dev/null -w 'host:8010 -> HTTP %{http_code}\n' --max-time 5 http://127.0.0.1:8010/api/v1/health 2>&1 || echo 'host:8010 不通'
              echo '--- ad-agent-backend 最近 200 行日志（重点：启动报错/迁移/依赖）---'
              S docker logs --tail 200 ad-agent-backend 2>&1 || true
              echo '--- 容器进程树 ---'
              S docker top ad-agent-backend 2>&1 | head -20 || true
            ) || true

            # ---- 宿主机反向代理：agent.heyinlin.asia（TLS 终结层）----
            # 实况：本机对外 80/443 由 **Caddy** 提供（HTTP 响应头 Server: Caddy），
            # 不是 nginx。旧 Streamlit 项目与根域 heyinlin.asia/www 同样走这个 Caddy。
            # 因此本段只做 Caddy 侧“诊断 + 幂等接入子域”，绝不改写根域既有站点块。
            DOMAIN="agent.heyinlin.asia"
            UPSTREAM="127.0.0.1:8502"     # web 容器发布的宿主端口
            echo "====== 宿主机反代诊断（Caddy / nginx）: ${DOMAIN} ======"
            # 1) 探测 Caddy 形态：二进制 / systemd / docker 容器
            CADDY_BIN=""
            for bin in "$(command -v caddy 2>/dev/null)" /usr/bin/caddy /usr/local/bin/caddy; do
              if [ -n "$bin" ] && [ -x "$bin" ]; then CADDY_BIN="$bin"; break; fi
            done
            CADDY_SVC=""
            if S systemctl list-units --type=service --all 2>/dev/null | grep -qE '^[[:space:]]*caddy\.service'; then CADDY_SVC=caddy; fi
            CADDY_CTR=$(S docker ps --format '{{.Names}} {{.Image}}' 2>/dev/null | grep -i caddy | head -1 | awk '{print $1}')
            echo "  caddy 二进制: ${CADDY_BIN:-未找到}"
            echo "  caddy systemd: ${CADDY_SVC:-无}"
            echo "  caddy 容器: ${CADDY_CTR:-无}"
            # 2) 定位 Caddy 的真实配置路径（本机 Caddyfile 不在 /etc/caddy/，实测诊断为空）
            #    依次尝试：systemd 单元 ExecStart 的 --config / -conf、caddy environ、常见路径
            CADDY_CONF=""
            if [ -n "$CADDY_SVC" ]; then
              echo '  --- systemd caddy.service 关键行 ---'
              S systemctl cat caddy 2>/dev/null | grep -iE 'ExecStart|EnvironmentFile|WorkingDirectory' || true
              UNIT_EXEC=$(S systemctl cat caddy 2>/dev/null | grep -i '^ExecStart' | head -1)
              for flag in --config -conf --config= -conf=; do
                case "$UNIT_EXEC" in
                  *"$flag"*) CADDY_CONF=$(printf '%s' "$UNIT_EXEC" | sed -n "s/.*$flag[= ]\([^ ]*\).*/\1/p" | head -1);;
                esac
              done
            fi
            if [ -z "$CADDY_CONF" ] && [ -n "$CADDY_BIN" ]; then
              CADDY_CONF=$(S "$CADDY_BIN" environ 2>/dev/null | sed -n 's/^CADDY_CONFIG=//p' | head -1)
            fi
            if [ -z "$CADDY_CONF" ]; then
              for c in /etc/caddy/Caddyfile /usr/local/etc/caddy/Caddyfile /opt/caddy/Caddyfile "$APP_DIR/deploy/caddy/Caddyfile"; do
                [ -f "$c" ] && { CADDY_CONF="$c"; break; }
              done
            fi
            echo "  caddy 配置路径: ${CADDY_CONF:-未找到}"
            # 3) 打印现有配置（判断 agent 子域如何定义；是否已 import conf.d）
            echo '  --- 现有 Caddy 配置（前 160 行）---'
            if [ -n "$CADDY_CONF" ] && [ -f "$CADDY_CONF" ]; then
              S sed -n '1,160p' "$CADDY_CONF" 2>&1 || true
            elif [ -n "$CADDY_CTR" ]; then
              S docker exec "$CADDY_CTR" sh -c 'cat /etc/caddy/Caddyfile 2>/dev/null | head -160' 2>&1 || true
            else
              echo '  !! 未定位到 Caddy 配置；尝试从运行态导出：caddy adapt / 看 admin API'
              if [ -n "$CADDY_BIN" ]; then
                echo '  --- 运行态配置（admin API /config/，需 admin 开启）---'
                curl -sS --max-time 5 http://127.0.0.1:2019/config/ 2>/dev/null | head -c 4000 || echo '  admin API 不可达'
                echo
              fi
            fi
            # 4) 幂等接入：写 drop-in 片段（Caddyfile 已 import conf.d 时最稳）
            CADDY_SNIPPET="/etc/caddy/conf.d/${DOMAIN}.caddy"
            mk_snippet() { printf '%s {\n\tencode gzip\n\treverse_proxy %s\n}\n' "$DOMAIN" "$UPSTREAM"; }
            echo "  --- 目标站点片段 ---"
            mk_snippet
            if [ -n "$CADDY_CONF" ] && [ -f "$CADDY_CONF" ] && S grep -qE '^[[:space:]]*import[[:space:]]+.*conf\.d' "$CADDY_CONF"; then
              SNIP_DIR=$(S sed -n 's/^[[:space:]]*import[[:space:]]\+\([^ ]*conf\.d\).*/\1/p' "$CADDY_CONF" | head -1)
              [ -n "$SNIP_DIR" ] || SNIP_DIR=/etc/caddy/conf.d
              S mkdir -p "$SNIP_DIR"
              mk_snippet | S tee "${SNIP_DIR}/${DOMAIN}.caddy" >/dev/null
              echo "== 已写入 ${SNIP_DIR}/${DOMAIN}.caddy =="
              if [ -n "$CADDY_BIN" ]; then
                if S "$CADDY_BIN" validate --config "$CADDY_CONF" >/dev/null 2>&1; then
                  S systemctl reload caddy 2>/dev/null || S "$CADDY_BIN" reload --config "$CADDY_CONF" 2>/dev/null || echo '!! caddy reload 需人工执行'
                  echo "== caddy 已校验并重载 =="
                else
                  echo '!! caddy validate 失败，未重载（请人工检查）'
                fi
              fi
            elif [ -n "$CADDY_CONF" ] && [ -f "$CADDY_CONF" ]; then
              # 没有 import conf.d：若配置里尚未出现该域名，则追加站点块（只追加，不改既有内容）
              if S grep -qE "(^|[[:space:]])${DOMAIN}([[:space:]]|\{|,)" "$CADDY_CONF"; then
                echo "!! 配置中已存在 ${DOMAIN} 相关条目，但证书未签发。"
                echo "   请在服务器检查该条目的 TLS/ACME 是否可用（如为 redir/handle 未含 tls，需改为 reverse_proxy 站点）。"
              else
                cp -a "$CADDY_CONF" "${CADDY_CONF}.bak-$(date +%Y%m%d-%H%M%S)" 2>/dev/null || S cp -a "$CADDY_CONF" "${CADDY_CONF}.bak-$(date +%Y%m%d-%H%M%S)"
                { printf '\n# ---- 由 deploy.yml 追加 %s ----\n' "$(date +%F)"; mk_snippet; } | S tee -a "$CADDY_CONF" >/dev/null
                echo "== 已追加 ${DOMAIN} 站点块到 ${CADDY_CONF} =="
                if [ -n "$CADDY_BIN" ] && S "$CADDY_BIN" validate --config "$CADDY_CONF" >/dev/null 2>&1; then
                  S systemctl reload caddy 2>/dev/null || S "$CADDY_BIN" reload --config "$CADDY_CONF" 2>/dev/null || echo '!! caddy reload 需人工执行'
                  echo "== caddy 已校验并重载 =="
                else
                  echo '!! 追加后 caddy validate 失败，请人工检查（已留 .bak 备份）'
                fi
              fi
            elif [ -n "$CADDY_CTR" ]; then
              echo "!! Caddy 以容器运行，配置在容器内。请把上面的站点片段加入其 Caddyfile 后重启容器。"
            else
              echo "!! 未能自动判定 Caddy 配置路径。请人工把上面的 ${DOMAIN} 站点片段加入 Caddyfile，再 reload。"
            fi
            # ---- TLS/ACME 现状诊断（非致命，纯观测）----
            # 目标：解释为何 https://agent.heyinlin.asia 握手失败（internal error）
            # 典型原因：Caddy 有站点块但证书未签发成功（ACME 被拦 / 域名未解析到本机 / 80 不可达）。
            (
              echo '====== TLS/ACME 诊断 ======'
              echo "--- 本机公网 IP 与 ${DOMAIN} 解析对照 ---"
              PUBIP=$(curl -sS --max-time 6 https://api.ipify.org 2>/dev/null || echo '?')
              echo "  本机公网 IP: ${PUBIP}"
              echo "  ${DOMAIN} 解析: $(getent hosts ${DOMAIN} 2>/dev/null | awk '{print $1}' | paste -sd, - || echo '解析失败')"
              echo '--- 443 本地握手探测（--resolve 指向本机，排除 DNS 干扰）---'
              curl -sk -o /dev/null -w '  https://%{http_code}\n' --max-time 6 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/" 2>&1 || echo '  443 握手失败'
              echo '--- ACME HTTP-01 路径可达性（Caddy 应返回 challenge 内容；308 则说明被全局重定向拦截）---'
              curl -sS -o /dev/null -w '  http://${DOMAIN}/.well-known/acme-challenge/probe -> HTTP %{http_code}\n' --max-time 6 -H "Host: ${DOMAIN}" http://127.0.0.1/.well-known/acme-challenge/probe 2>&1 || echo '  ACME 路径不可达'
              echo '--- Caddy 证书存储（看是否已有 ${DOMAIN} 的证书）---'
              if [ -n "$CADDY_BIN" ]; then
                S ls -la /var/lib/caddy/.local/share/caddy/certificates/ 2>/dev/null | head -20 || echo '  未找到 caddy 证书目录（容器形态可能在卷内）'
              fi
              if [ -n "$CADDY_CTR" ]; then
                echo "--- 容器内 caddy 日志（最近 40 行，含 ACME 报错）---"
                S docker logs --tail 40 "$CADDY_CTR" 2>&1 || true
              elif [ -n "$CADDY_SVC" ]; then
                echo "--- caddy systemd 日志（最近 40 行，含 ACME 报错）---"
                S journalctl -u caddy --no-pager -n 40 2>&1 || true
              fi
            ) || true
