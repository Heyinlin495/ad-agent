# ============================================================
# 宿主机 nginx —— agent.heyinlin.asia 对外入口（TLS 终结层）
#
# 职责：为子域名 agent.heyinlin.asia 提供 HTTPS，并把所有请求转发到
# docker compose 里 web 容器发布的 127.0.0.1:8502。
# 容器内 nginx 再负责把 /api、/api/v1/ads/(SSE)、/files/ 反代到 backend。
#
# ⚠️ 背景：heyinlin.asia 根域与 www 被服务器上的"旧 Streamlit 项目"占用，
# 本配置只服务新子域 agent.heyinlin.asia，与旧 nginx / 旧项目完全隔离，
# 不修改、不触碰对方任何监听块。
#
# 安装位置（由 deploy 脚本探测，兼容两种主流布局）：
#   /etc/nginx/conf.d/agent.heyinlin.asia.conf   或
#   /etc/nginx/sites-available/+symlink -> sites-enabled/
# 若服务器 nginx 是非标准安装（如编译版 /usr/local/nginx、或 docker 跑 nginx），
# 需人工把等价 server 块放进实际使用的 nginx.conf 并 reload。
#
# 证书：Let's Encrypt（certbot），标准子目录路径引用。
#   首次签发（需域名已解析到本机 + 80 端口可被 ACME 访问）：
#     certbot certonly --webroot -w /var/www/certbot \
#       -d agent.heyinlin.asia --agree-tos --email <你的邮箱>
#
# 校验：nginx -t && systemctl reload nginx（或 nginx -s reload）
# ============================================================

# ---- HTTP: 只放 ACME 校验目录，其余一律 301 到 HTTPS ----
# ⚠️ 若 80 端口已被旧 nginx 独占（本机正是如此），此 HTTP 段可能无法直接 server_name
#    匹配外层——ACME 校验可改由旧 nginx 单独放行，或临时把本段 listen 到其他端口。详见 deploy 脚本。
server {
    listen 80;
    listen [::]:80;
    server_name agent.heyinlin.asia;

    # Let's Encrypt HTTP-01 校验目录；证书签发/续期必须可达
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agent.heyinlin.asia;

    ssl_certificate     /etc/letsencrypt/live/agent.heyinlin.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.heyinlin.asia/privkey.pem;

    # 现代 TLS：仅 TLS1.2+，优先 X25519/ECDHE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 24h;

    # HSTS：证书稳定后开启
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全响应头（容器内 nginx 也会再加一套，双保险无害）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # 转发到 web 容器（其内部 nginx 再按 /api、/api/v1/ads/、/files/ 路由到 backend）
    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;

        # 关键：把真实客户端信息透传给容器，供后端的 IP/限流取用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # SSE 长连接：关闭缓冲，放大超时（容器内对 /api/v1/ads/ 已关缓冲，这里双保险）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_redirect off;
    }
}