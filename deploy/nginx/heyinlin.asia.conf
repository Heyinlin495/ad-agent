# ============================================================
# 宿主机 nginx —— heyinlin.asia 对外入口（TLS 终结层）
#
# 职责：为域名 heyinlin.asia / www.heyinlin.asia 提供 HTTPS，
# 并把所有请求转发到 docker compose 里 web 容器发布的 127.0.0.1:8502。
# 容器内 nginx 再负责把 /api、/api/v1/ads/(SSE)、/files/ 反代到 backend。
#
# 安装位置：/etc/nginx/conf.d/heyinlin.asia.conf（或 sites-available + 符号链接）
# 证书：Let's Encrypt（certbot），标准路径已在此引用。
#   首次签发（需域名已解析到本机，且 80 端口临时可达）：
#     certbot certonly --webroot -w /var/www/certbot \
#       -d heyinlin.asia -d www.heyinlin.asia --agree-tos --email <你的邮箱>
#   （本期已用 webroot 方案，HTTP 段的 /.well-known/acme-challenge/ 已放行）
#
# 校验：nginx -t && systemctl reload nginx  （或 nginx -s reload）
# ============================================================

# ---- HTTP: 只放 ACME 校验目录，其余一律 301 到 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name heyinlin.asia www.heyinlin.asia;

    # Let's Encrypt HTTP-01 校验目录；证书签发/续期必须可达
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name heyinlin.asia www.heyinlin.asia;

    ssl_certificate     /etc/letsencrypt/live/heyinlin.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heyinlin.asia/privkey.pem;

    # 现代 TLS：仅 TLS1.2+，优先 X25519/ECDHE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 24h;

    # HSTS：仅当证书续期稳定后开启（此处先注释掉，避免证书一次性未续导致浏览器锁死；稳定后可 `always` 取消注释）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 安全响应头（容器内 nginx 也会再加一套，双保险无害）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # 转发到 web 容器（其内部 nginx 再按 /api、/api/v1/ads/、/files/ 路由到 backend）
    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;

        # 关键：把真实客户端信息透传给容器，供后端的 IP/限流取用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # SSE 长连接：关闭缓冲，放大超时（容器内对 /api/v1/ads/ 已关缓冲，这里双保险）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_redirect off;
    }
}